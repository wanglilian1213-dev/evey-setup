# LiteLLM Proxy Configuration
# Generated by evey-setup; edit freely after install.
#
# API keys and optional provider URLs are read from .env through os.environ/ references.
# Supported cloud providers out of the box:
# - OpenAI: OPENAI_API_KEY
# - Kimi / Moonshot: MOONSHOT_API_KEY
# - Qwen / DashScope: DASHSCOPE_API_KEY
# - GLM / Z.AI: ZAI_API_KEY
# - OpenRouter: OPENROUTER_API_KEY

model_list:
  # Default alias used by Hermes. If the first route lacks a key or fails,
  # LiteLLM can try the fallback chain below.
  - model_name: brain
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/OPENAI_API_BASE

  # Cloud provider routes.
  - model_name: openai-main
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/OPENAI_API_BASE

  - model_name: kimi-main
    litellm_params:
      model: moonshot/kimi-k2.5
      api_key: os.environ/MOONSHOT_API_KEY
      api_base: os.environ/MOONSHOT_API_BASE

  - model_name: qwen-main
    litellm_params:
      model: dashscope/qwen-plus
      api_key: os.environ/DASHSCOPE_API_KEY
      api_base: os.environ/DASHSCOPE_API_BASE

  - model_name: glm-main
    litellm_params:
      model: zai/glm-4.5-flash
      api_key: os.environ/ZAI_API_KEY
      api_base: os.environ/ZAI_API_BASE

  - model_name: openrouter-main
    litellm_params:
      model: openrouter/xiaomi/mimo-v2-pro
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: os.environ/OPENROUTER_API_BASE
      extra_headers:
        HTTP-Referer: "https://openclaw.ai"
        X-OpenRouter-Title: "OpenClaw"
        X-OpenRouter-Categories: "cli-agent"
      extra_body:
        reasoning:
          exclude: true

  # Local models through Ollama. Pull models after install before using them.
  - model_name: hermes3-8b
    litellm_params:
      model: ollama/hermes3:8b
      api_base: http://hermes-ollama:11434
      input_cost_per_token: 0
      output_cost_per_token: 0

  - model_name: qwen35-4b
    litellm_params:
      model: ollama/qwen3.5:4b
      api_base: http://hermes-ollama:11434
      input_cost_per_token: 0
      output_cost_per_token: 0

fallbacks:
  - brain: [openai-main, kimi-main, qwen-main, glm-main, openrouter-main, hermes3-8b]
  - openai-main: [kimi-main, qwen-main, glm-main, openrouter-main, hermes3-8b]
  - kimi-main: [qwen-main, glm-main, openrouter-main, openai-main, hermes3-8b]
  - qwen-main: [glm-main, openrouter-main, openai-main, kimi-main, qwen35-4b]
  - glm-main: [qwen-main, openrouter-main, openai-main, kimi-main, hermes3-8b]
  - openrouter-main: [openai-main, kimi-main, qwen-main, glm-main, hermes3-8b]

router_settings:
  routing_strategy: simple-shuffle

litellm_settings:
  max_budget: 5.0
  budget_duration: 1d
  num_retries: 2
  retry_after: 5
  cache: true
  cache_params:
    type: "local"
    ttl: 300
    supported_call_types: ["acompletion", "completion"]
  # Uncomment for Langfuse cost tracking:
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
